# Copia questo file come config.toml e modificalo.
# Le chiavi segrete (API Anthropic, bot Telegram) vanno nel file .env, non qui.

[vinted]
dominio = "https://www.vinted.it"
# Ogni giro aspetta un tempo casuale tra questi due valori (jitter)
intervallo_min_secondi = 60
intervallo_max_secondi = 120
# Pausa casuale tra una ricerca e l'altra nello stesso giro
pausa_tra_ricerche_secondi = [3, 8]
# Backoff: alla prima risposta 403/429 aspetta 5 min, poi 10, 20, 40... fino a 60
backoff_blocco_minuti = 5
# Errori di rete (PC offline, timeout): si parte da 1 minuto
backoff_errore_minuti = 1
backoff_max_minuti = 60
# Se lo script resta fermo più di N minuti (PC spento, blocco di Vinted), al giro dopo
# gli annunci usciti nel frattempo vengono segnati come visti senza avvisi
eta_massima_annuncio_minuti = 30
# Annunci ripubblicati/promossi: compaiono tra i "più recenti" ma hanno un ID molto più basso
# dell'ultimo visto. Sotto questo margine sono considerati vecchi (1.000.000 di ID ≈ circa un'ora su Vinted)
margine_id_vecchi = 1000000
risultati_per_ricerca = 20

# Le ricerche: filtra su vinted.it dal browser (categoria, marca, taglia, prezzo),
# poi copia l'URL della pagina e incollalo qui. Ogni ricerca = una richiesta a giro,
# quindi meglio poche ricerche ben filtrate che tante.
[[ricerche]]
nome = "Maglie calcio"
url = "https://www.vinted.it/catalog?search_text=maglia%20calcio&order=newest_first"

# [[ricerche]]
# nome = "Nike retro"
# url = "https://www.vinted.it/catalog?search_text=maglia%20nike%20vintage&order=newest_first"

[analisi]
modello = "claude-haiku-5-5"
# Foto massime inviate al modello per annuncio (più foto = più costo)
max_foto = 8
# Tetto di sicurezza sui costi
max_analisi_al_giorno = 200
# Ricerche web massime per identificare un codice
ricerche_web_per_codice = 3
# Prezzi in dollari usati per calcolare il costo nel log (default: Claude Haiku 5.5).
# Se cambi modello aggiornali con quelli della pagina prezzi di Anthropic.
prezzo_input_mtok = 0.10          # per milione di token in input
prezzo_output_mtok = 0.50         # per milione di token in output
prezzo_ricerca_web = 0.01         # per ricerca
soglia_prompt_lungo = 100000      # oltre questa soglia di input, una richiesta Haiku 5.5 costa di più:
prezzo_input_mtok_lungo = 0.50
prezzo_output_mtok_lungo = 2.50

[telegram]
# true = avviso subito appena esce l'annuncio, poi la risposta con l'esito
# false = un solo messaggio, a analisi finita
avviso_immediato = true
